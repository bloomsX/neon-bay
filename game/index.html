<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BAY — A Sun-Soaked Open-World Crime Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1024;
    font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  .hidden { display: none !important; }

  /* ------------------------------------------------------------ HUD root */
  .hud-root { position: fixed; inset: 0; pointer-events: none; z-index: 10;
    font-family: Arial, Helvetica, sans-serif; }
  .hud-root.in-menu .panel, .hud-root.in-menu .wanted-wrap, .hud-root.in-menu .weapons,
  .hud-root.in-menu .bottom-left, .hud-root.in-menu .bottom-right, .hud-root.in-menu .dialogue {
    display: none; }
  .panel { background: rgba(12, 8, 24, 0.72); border: 1px solid rgba(255, 178, 46, 0.55);
    border-radius: 8px; padding: 8px 10px; backdrop-filter: blur(2px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45); }

  /* ---------------------------------------------------- mission header */
  .mission-header { position: absolute; top: 12px; left: 12px; width: 320px; }
  .mh-job { font-size: 11px; letter-spacing: 1.5px; color: #ffb02e; font-weight: bold; }
  .mh-title { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7); line-height: 1.1; }
  .mh-stage { font-size: 12px; color: #35e0ff; font-weight: bold; margin-top: 2px; }
  .mh-next { font-size: 13px; color: #ffe9a8; margin-top: 3px; line-height: 1.25; }
  .mh-timer { font-size: 13px; font-weight: bold; color: #7dff9a; margin-top: 3px; }
  .mh-timer.urgent { color: #ff5a5a; animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }

  /* --------------------------------------------------------- wanted/cash */
  .wanted-wrap { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    text-align: center; }
  .wanted-stars { font-size: 34px; letter-spacing: 6px; color: rgba(255,255,255,0.35);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8); line-height: 1; }
  .wanted-stars.warm { color: #ffd23e; }
  .wanted-stars.hot { color: #ff2e3d; animation: blink 0.7s steps(2) infinite; }
  .cash { font-size: 22px; font-weight: 900; color: #7dff9a; margin-top: 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8); }

  /* ------------------------------------------------------------ dispatch */
  .dispatch { position: absolute; top: 12px; right: 12px; width: 300px; }
  .dp-title { font-size: 12px; letter-spacing: 2px; color: #7db8ff; font-weight: 900;
    border-bottom: 1px solid rgba(125,184,255,0.4); padding-bottom: 4px; margin-bottom: 5px; }
  .dp-row { display: flex; justify-content: space-between; font-size: 12px;
    padding: 2px 0; color: #e8ecff; }
  .dp-row.heli { color: #ff9aa2; font-weight: bold; }
  .dp-unit { font-weight: 900; width: 62px; }
  .dp-role { flex: 1; }
  .dp-dist { font-weight: bold; color: #ffb02e; }
  .dp-tactic { font-size: 11px; letter-spacing: 1px; color: #ff9aa2; font-weight: bold;
    margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px; }

  /* ------------------------------------------------------------ weapons */
  .weapons { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 4px; }
  .weapon-slot { background: rgba(12, 8, 24, 0.72); border: 1px solid rgba(255,255,255,0.35);
    border-radius: 5px; padding: 4px 8px; font-size: 11px; color: #cfd4e8;
    display: flex; gap: 7px; align-items: center; min-width: 96px; }
  .weapon-slot.active { background: #ffb02e; color: #1a1024; font-weight: 900;
    border-color: #fff; box-shadow: 0 0 10px rgba(255,178,46,0.8); }
  .ws-key { font-weight: 900; font-size: 12px; }

  /* ---------------------------------------------------------- bottom-left */
  .bottom-left { position: absolute; left: 12px; bottom: 12px; display: flex;
    flex-direction: column; gap: 6px; }
  .minimap-wrap { width: 190px; height: 190px; border-radius: 50%; overflow: hidden;
    border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 2px 14px rgba(0,0,0,0.6);
    background: #141824; }
  #minimap { display: block; width: 190px; height: 190px; }
  .bars { width: 190px; }
  .bar { height: 14px; border-radius: 4px; background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.4); overflow: hidden; margin-top: 4px; }
  .bar.health { background: linear-gradient(90deg, #ff2e3d, #ff6a5a); background-color: #40151a; }
  .bar.armour { background: linear-gradient(90deg, #2e6bff, #35a0ff); background-color: #14203a; }
  .bar-label { font-size: 11px; font-weight: 900; letter-spacing: 1px; margin-top: 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9); }

  /* --------------------------------------------------------- bottom-right */
  .bottom-right { position: absolute; right: 12px; bottom: 12px; text-align: right; }
  .speed { font-size: 64px; font-weight: 900; line-height: 0.9; color: #fff;
    text-shadow: 0 3px 10px rgba(0,0,0,0.85); }
  .speed::after { content: " km/h"; font-size: 16px; color: #ffb02e; }
  .car-name { font-size: 16px; font-weight: 900; letter-spacing: 1px; color: #ffe9a8; }
  .car-cond { font-size: 12px; color: #cfd4e8; }
  .radio { font-size: 13px; color: #ff4fa3; font-weight: bold; margin-top: 4px; }
  .location { font-size: 12px; color: #9adfff; letter-spacing: 1px; }

  /* ------------------------------------------------------------ dialogue */
  .dialogue { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: 560px; max-width: 46vw; display: none; align-items: flex-start; gap: 10px;
    background: rgba(12, 8, 24, 0.82); border: 1px solid rgba(255, 79, 163, 0.6);
    border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.6); }
  .dialogue.visible { display: flex; }
  .dlg-portrait { width: 64px; height: 64px; border-radius: 8px; flex-shrink: 0; }
  .dlg-name { font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #ff4fa3; }
  .dlg-line { font-size: 15px; line-height: 1.35; color: #fff; margin-top: 2px; }
  .dlg-hint { font-size: 11px; color: #9a93a8; margin-top: 4px; }

  /* ----------------------------------------------------------- toast/prompt */
  .toast { position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
    background: rgba(12, 8, 24, 0.85); border: 1px solid #ffb02e; border-radius: 6px;
    padding: 7px 14px; font-size: 14px; font-weight: bold; display: none; white-space: nowrap; }
  .toast.visible { display: block; }
  .toast.wanted { border-color: #ff2e3d; color: #ff9aa2; }
  .toast.mission { border-color: #ffd23e; color: #ffe9a8; }
  .prompt { position: absolute; left: 50%; bottom: 170px; transform: translateX(-50%);
    background: rgba(255, 178, 46, 0.92); color: #1a1024; font-weight: 900; font-size: 14px;
    letter-spacing: 1px; padding: 7px 14px; border-radius: 6px; display: none; }
  .prompt.visible { display: block; }

  /* -------------------------------------------------------------- screens */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; pointer-events: auto; z-index: 20;
    background: linear-gradient(180deg, rgba(26,16,36,0.55) 0%, rgba(26,16,36,0.25) 45%, rgba(26,16,36,0.78) 100%); }
  .start-screen { background: linear-gradient(180deg, rgba(43,58,110,0.5) 0%, rgba(255,122,77,0.25) 55%, rgba(26,16,36,0.82) 100%); }
  .ss-kicker { font-size: 13px; letter-spacing: 4px; color: #ffd23e; font-weight: bold; }
  .ss-title { font-size: 96px; font-weight: 900; letter-spacing: 6px; color: #fff;
    text-shadow: 0 0 24px rgba(255, 79, 163, 0.8), 0 4px 18px rgba(0,0,0,0.8); line-height: 1; }
  .ss-title.small { font-size: 64px; }
  .ss-sub { font-size: 18px; color: #ffe9a8; margin-top: 10px; }
  .ss-crew { font-size: 14px; letter-spacing: 2px; color: #35e0ff; margin-top: 14px; font-weight: bold; }
  .ss-controls { font-size: 13px; color: #e8ecff; margin-top: 18px; line-height: 1.7; }
  .ss-button { pointer-events: auto; margin-top: 26px; font-size: 20px; font-weight: 900;
    letter-spacing: 2px; color: #1a1024; background: #ffb02e; border: none; border-radius: 8px;
    padding: 14px 42px; cursor: pointer; box-shadow: 0 4px 20px rgba(255,178,46,0.6); }
  .ss-button:hover { background: #ffd23e; }
  .ss-foot { font-size: 12px; color: #9a93a8; margin-top: 18px; }
  .wasted-screen { background: rgba(20, 4, 8, 0.72); }
  .wasted-title { font-size: 110px; font-weight: 900; letter-spacing: 10px; color: #ff2e3d;
    text-shadow: 0 0 30px rgba(255, 46, 61, 0.7), 0 4px 18px rgba(0,0,0,0.9); }
</style>
</head>
<body>
<div id="game"></div>
<script src="vendor/three.min.js"></script>
<script src="src/config.js"></script>
<script src="src/random.js"></script>
<script src="src/world.js"></script>
<script src="src/render.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/pedestrians.js"></script>
<script src="src/police.js"></script>
<script src="src/missions.js"></script>
<script src="src/hud.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
