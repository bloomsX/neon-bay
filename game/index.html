<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BAY — Game Dunia Terbuka</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #12081f;
    font-family: "Segoe UI", Arial, sans-serif; color: #f2ecff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .hud-topleft { position: absolute; top: 16px; left: 16px; }
  .hud-cash { font-size: 30px; font-weight: 800; color: #ffd23e;
    text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(255,210,62,.35); }
  .hud-health { width: 210px; height: 12px; margin-top: 6px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px; overflow: hidden; }
  .hud-health-bar { height: 100%; width: 100%; background: #59d867; transition: width .2s; }
  .hud-stars { margin-top: 6px; font-size: 24px; letter-spacing: 3px;
    text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  .hud-fps { position: absolute; top: 16px; right: 16px; font-size: 13px; font-weight: 700;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    padding: 4px 9px; color: #bfefff; }
  .hud-mission { position: absolute; left: 16px; bottom: 210px; max-width: 330px;
    background: rgba(10,6,24,.72); border: 1px solid rgba(255,46,136,.55); border-left: 5px solid #ff2e88;
    border-radius: 8px; padding: 10px 14px; }
  .hud-mission-title { font-size: 16px; font-weight: 800; color: #ff8ac0; }
  .hud-mission-brief { font-size: 13px; color: #e8e2ff; margin-top: 3px; line-height: 1.4; }
  .hud-mission-dist { font-size: 12px; color: #ffd23e; margin-top: 5px; font-weight: 700; }
  .hud-mapwrap { position: absolute; left: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,.35);
    border-radius: 8px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  .hud-map { display: block; width: 190px; height: 190px; }
  .hud-speed { position: absolute; right: 20px; bottom: 20px; font-size: 34px; font-weight: 800;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.65), 0 0 16px rgba(41,211,255,.5); }
  .hud-cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 22px; font-weight: 700; color: rgba(255,255,255,.85); text-shadow: 0 0 6px #000; }
  .hud-toasts { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .toast { background: rgba(10,6,24,.85); border: 1px solid rgba(255,210,62,.6); color: #ffe9a8;
    font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.5); white-space: nowrap; }

  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, rgba(18,8,31,.82), rgba(40,12,52,.88)); padding: 20px; }
  .title-logo { font-size: 84px; font-weight: 900; letter-spacing: 10px; line-height: 1;
    background: linear-gradient(90deg, #ff2e88, #ff9a2e 45%, #29d3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255,46,136,.55)); }
  .title-sub { margin-top: 8px; font-size: 18px; color: #ffd9a8; font-weight: 600; }
  .title-story { max-width: 620px; margin-top: 18px; font-size: 15px; line-height: 1.6; color: #e8e2ff; }
  .title-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 26px; margin-top: 20px;
    text-align: left; font-size: 14px; }
  .ctl-row { display: flex; gap: 10px; align-items: baseline; }
  .ctl-key { min-width: 92px; font-weight: 800; color: #29d3ff; }
  .ctl-desc { color: #cfc8ee; }
  .btn-big { pointer-events: auto; margin-top: 22px; font-size: 20px; font-weight: 800; letter-spacing: 2px;
    color: #1a0a24; background: linear-gradient(90deg, #ff2e88, #ff9a2e); border: none; border-radius: 10px;
    padding: 13px 44px; cursor: pointer; box-shadow: 0 6px 24px rgba(255,46,136,.45); }
  .btn-big:hover { filter: brightness(1.12); }
  .btn-ghost { background: transparent; color: #ffd23e; border: 2px solid #ffd23e; box-shadow: none; }
  .title-foot { margin-top: 22px; font-size: 12px; color: #9a8fc0; }
  .pause-title { font-size: 56px; font-weight: 900; letter-spacing: 14px; color: #fff;
    text-shadow: 0 0 24px rgba(41,211,255,.7); }
  .end-title { font-size: 64px; font-weight: 900; letter-spacing: 8px; color: #ff3b30;
    text-shadow: 0 0 26px rgba(255,59,48,.6); }
  .end-text { margin-top: 10px; font-size: 17px; color: #ffe9e8; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
